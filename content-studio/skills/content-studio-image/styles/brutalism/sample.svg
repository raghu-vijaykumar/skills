<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Bold brutalist post about clear communication"><rect x="0" y="0" width="1080" height="1350" fill="#f8f4df" /><rect x="0" y="0" width="1080" height="24" fill="#171717" /><rect x="81" y="81" width="170" height="20" fill="#ffdf37" stroke="#171717" stroke-width="3" /><text x="81" y="186.0" fill="#171717" font-size="58" font-weight="bold" font-family="Arial Black" text-anchor="start">Say it plainly</text><text x="81" y="276.5" fill="#3e3e3e" font-size="27" font-weight="normal" font-family="Arial Black" text-anchor="start">A direct opinion</text><rect x="112" y="473.5875" width="882" height="594.125" fill="#171717" /><rect x="99" y="460.5875" width="882" height="594.125" fill="#ffdf37" stroke="#171717" stroke-width="5" /><text x="151" y="715.2125" fill="#171717" font-size="58" font-weight="bold" font-family="Arial Black" text-anchor="start">If it matters, make it</text><text x="151" y="787.7125" fill="#171717" font-size="58" font-weight="bold" font-family="Arial Black" text-anchor="start">understandable.</text><line x1="81" y1="1234" x2="999" y2="1234" stroke="#171717" stroke-width="2" /></svg>