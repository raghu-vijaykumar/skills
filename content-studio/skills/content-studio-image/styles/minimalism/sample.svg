<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Minimal post about choosing one priority"><rect x="0" y="0" width="1080" height="1350" fill="#fafaf7" /><line x1="81" y1="81" x2="999" y2="81" stroke="#1c7865" stroke-width="2" /><text x="81" y="186.0" fill="#17212b" font-size="58" font-weight="bold" font-family="Arial" text-anchor="start">Make room for one thing</text><text x="81" y="276.5" fill="#5e6870" font-size="27" font-weight="normal" font-family="Arial" text-anchor="start">A short thought on attention</text><rect x="93" y="553.95" width="8" height="356.47499999999997" fill="#1c7865" /><text x="143" y="715.2125" fill="#17212b" font-size="58" font-weight="bold" font-family="Arial" text-anchor="start">A clear priority can be</text><text x="143" y="787.7125" fill="#17212b" font-size="58" font-weight="bold" font-family="Arial" text-anchor="start">enough for today.</text><line x1="81" y1="1234" x2="999" y2="1234" stroke="#aeb9b5" stroke-width="2" /></svg>