<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Hand-drawn post with three iterative steps"><rect x="0" y="0" width="1080" height="1350" fill="#fffdf4" /><path d="M 81 81 Q 540.0 70 999 86" fill="none" stroke="#d06048" stroke-width="5" /><text x="81" y="186.0" fill="#26343c" font-size="58" font-weight="bold" font-family="Comic Sans MS" text-anchor="start">Try, learn, repeat</text><text x="81" y="276.5" fill="#647077" font-size="27" font-weight="normal" font-family="Comic Sans MS" text-anchor="start">A sketchbook reminder</text><path d="M 101 360.25 Q 540.0 351.25 987 367.25 L 990 614.1666666666667 Q 540.0 626.1666666666667 89 618.1666666666667 Z" fill="#fffef8" stroke="#526c78" stroke-width="3" /><path d="M 106 368.25 Q 540.0 362.25 980 372.25" fill="none" stroke="#d06048" stroke-width="2" /><circle cx="151" cy="491.70833333333337" r="27" fill="#d06048" /><text x="151" y="501.70833333333337" fill="#fffdf4" font-size="27" font-weight="bold" font-family="Comic Sans MS" text-anchor="middle">1</text><text x="206" y="503.70833333333337" fill="#26343c" font-size="37" font-weight="bold" font-family="Comic Sans MS" text-anchor="start">Try a small version</text><path d="M 101 643.1666666666667 Q 540.0 634.1666666666667 987 650.1666666666667 L 990 897.0833333333335 Q 540.0 909.0833333333335 89 901.0833333333335 Z" fill="#fffef8" stroke="#526c78" stroke-width="3" /><path d="M 106 651.1666666666667 Q 540.0 645.1666666666667 980 655.1666666666667" fill="none" stroke="#d06048" stroke-width="2" /><circle cx="151" cy="774.6250000000001" r="27" fill="#d06048" /><text x="151" y="784.6250000000001" fill="#fffdf4" font-size="27" font-weight="bold" font-family="Comic Sans MS" text-anchor="middle">2</text><text x="206" y="786.6250000000001" fill="#26343c" font-size="37" font-weight="bold" font-family="Comic Sans MS" text-anchor="start">Notice what happens</text><path d="M 101 926.0833333333334 Q 540.0 917.0833333333334 987