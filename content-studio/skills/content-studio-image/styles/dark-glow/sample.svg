<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Dark glowing post inviting a first step"><rect x="0" y="0" width="1080" height="1350" fill="#0b1224" /><line x1="81" y1="81" x2="999" y2="81" stroke="#6bf4ce" stroke-width="10" opacity="0.12" /><line x1="81" y1="81" x2="999" y2="81" stroke="#6bf4ce" stroke-width="2" /><text x="81" y="186.0" fill="#f4f8ff" font-size="58" font-weight="bold" font-family="Arial" text-anchor="start">What will you build next?</text><text x="81" y="276.5" fill="#acbddb" font-size="27" font-weight="normal" font-family="Arial" text-anchor="start">An invitation to begin</text><rect x="93" y="454.5875" width="894" height="606.125" rx="24" fill="#6bf4ce" opacity="0.10" /><rect x="99" y="460.5875" width="882" height="594.125" rx="19" fill="#18284b" stroke="#6bf4ce" stroke-width="2" /><text x="151" y="715.2125" fill="#f4f8ff" font-size="58" font-weight="bold" font-family="Arial" text-anchor="start">Turn a small idea into a</text><text x="151" y="787.7125" fill="#f4f8ff" font-size="58" font-weight="bold" font-family="Arial" text-anchor="start">first step.</text><line x1="81" y1="1234" x2="999" y2="1234" stroke="#65a6b9" stroke-width="2" /></svg>