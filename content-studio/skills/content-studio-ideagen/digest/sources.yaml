# Viral research papers — ranked by community signal (upvotes / points), with no
# minimum threshold. Rendered as its own "Viral Research Papers" section.
papers:
  enabled: true
  # 0 = no limit (rank every in-window paper).
  limit: 0
  providers:
    # Hugging Face Daily Papers: community upvotes, the de-facto "viral AI
    # papers" list. Endpoint returns the most recent ~2 days.
    huggingface:
      enabled: true
    # Hacker News: arXiv papers going viral in discussion, ranked by points.
    # Broader than AI.
    hackernews:
      enabled: true
