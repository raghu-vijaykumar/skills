# Daily digest sources — the source of truth.
#
# Each entry is fetched, filtered to the lookback window (--days / --since), and
# grouped under its topic in the idea digest. Set `enabled: false` to mute
# a source without deleting it. Each source needs `name` and the address for
# its type: `url` for RSS, `baseUrl` for scrape, or `sitemapUrl` for sitemap.
#
# A feed that fails to fetch does not abort the run: it logs a warning and the
# remaining sources continue.

settings:
  # Used to label preview dates; set for the intended channel.
  timezone: Asia/Kolkata
  # Defaults, overridable with --days / --limit.
  lookbackDays: 1
  # 0 = no limit (show every in-window item). Set a number to cap each section.
  limitPerSection: 0

topics:
  - id: ai
    label: AI & ML
    emoji: "🧠"
    sources:
      - name: OpenAI
        url: https://openai.com/news/rss.xml
      - name: Google AI
        url: https://blog.google/technology/ai/rss/
      - name: Google DeepMind
        url: https://deepmind.google/blog/rss.xml
      # Company research and engineering feeds with recent dated entries.
