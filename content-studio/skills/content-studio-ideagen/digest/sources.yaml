    emoji: "📄"
    sources:
      # arXiv's RSS endpoints are empty; the Atom API query is the working path.
      - name: arXiv cs.AI
        url: https://export.arxiv.org/api/query?search_query=cat:cs.AI&sortBy=submittedDate&sortOrder=descending&max_results=25
      - name: arXiv cs.LG
